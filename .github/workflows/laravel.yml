name: Laravel CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cacheCv4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate key
        run: php artisan key:generate

      - name: Run Tests (Pest)
        run: ./vendor/bin/pest
        continue-on-error: true

      - name: Run Lint (Pint)
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=256M
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: laravel-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t astervpn-admin .
        continue-on-error: true

      - name: Push to Railway (placeholder)
        run: echo "Deploy to Railway via Railway CLI or GitHub integration"
        continue-on-error: true